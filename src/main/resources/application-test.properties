# AMBIENTE
app.environment=test

# JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none

# LOG
logging.level.root=INFO
logging.level.com.example.spring_course=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=TRACE

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.liquibase.enabled=false
spring.mongodb.uri=${SPRING_DATASOURCE_URL_MONGO:mongodb://root:root@localhost:27017/spring_course?authSource=admin}

# Cache demo: provider in-memory di Spring
spring.cache.type=simple

# Scheduling demo
app.scheduler.product-stats.fixed-rate=30000
app.scheduler.product-stats.initial-delay=5000

# Integration tests use the same Flyway schema as the normal test profile.
spring.jpa.hibernate.ddl-auto=none

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.liquibase.enabled=false

# Batch metadata is created by Flyway V5, not by Spring Batch initialization.
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=never

# SQL logs
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true