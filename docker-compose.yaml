services:
  db:
    image: postgres:16

    environment:
      POSTGRES_DB: local_db
      POSTGRES_USER: pippo
      POSTGRES_PASSWORD: pippo

    ports:
      - "5433:5432"

    volumes:
      - dati-local_db:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d

  mongo:
    image: mongo:8.0
    container_name: spring-course-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - dati-mongodb:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --username
        - root
        - --password
        - root
        - --authenticationDatabase
        - admin
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  dati-local_db:
  dati-mongodb:


