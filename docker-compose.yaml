services:
  db:
    image: postgres:16

    environment:
      POSTGRES_DB: local_db
      POSTGRES_USER: pippo
      POSTGRES_PASSWORD: pippo

    ports:
      - "5433:5432"

    volumes:
      - dati-local_db:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d

volumes:
  dati-local_db:


